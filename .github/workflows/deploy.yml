name: Deploy AURA Video Editor

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install FFmpeg WASM packages
        run: npm install --ignore-scripts

      - name: Build static site with local FFmpeg assets
        shell: bash
        run: |
          rm -rf dist
          mkdir -p dist/vendor
          cp index.html dist/index.html
          cp node_modules/@ffmpeg/ffmpeg/dist/umd/ffmpeg.js dist/vendor/ffmpeg.js
          cp node_modules/@ffmpeg/ffmpeg/dist/umd/814.ffmpeg.js dist/vendor/814.ffmpeg.js
          cp node_modules/@ffmpeg/core/dist/umd/ffmpeg-core.js dist/vendor/ffmpeg-core.js
          cp node_modules/@ffmpeg/core/dist/umd/ffmpeg-core.wasm dist/vendor/ffmpeg-core.wasm
          printf '%s\n' 'AURA Video Editor' > dist/README.txt
          touch dist/.nojekyll
          echo "Built files:"
          find dist -maxdepth 2 -type f -printf '%p %k KB\n' | sort

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
