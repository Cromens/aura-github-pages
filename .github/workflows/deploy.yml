name: Deploy AURA Video Editor

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: Build AURA Video Editor
    runs-on: ubuntu-latest

    steps:
      # 1. Получаем код из репозитория
      - name: Checkout
        uses: actions/checkout@v4

      # 2. Устанавливаем Node.js
      # ВАЖНО: cache:npm убран, поэтому package-lock.json НЕ требуется
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # 3. Проверяем структуру проекта
      - name: Check project files
        shell: bash
        run: |
          echo "=== Project files ==="
          ls -la

          echo ""
          echo "=== Required files ==="

          test -f index.html || {
            echo "ERROR: index.html not found"
            exit 1
          }

          test -f package.json || {
            echo "ERROR: package.json not found"
            exit 1
          }

          echo "✓ index.html found"
          echo "✓ package.json found"

      # 4. Устанавливаем FFmpeg WASM
      - name: Install FFmpeg WASM packages
        shell: bash
        run: |
          npm install --no-audit --no-fund

      # 5. Проверяем, что FFmpeg действительно установлен
      - name: Verify FFmpeg packages
        shell: bash
        run: |
          echo "=== @ffmpeg/ffmpeg ==="
          npm list @ffmpeg/ffmpeg || true

          echo ""
          echo "=== @ffmpeg/core ==="
          npm list @ffmpeg/core || true

          echo ""
          echo "=== FFmpeg package files ==="

          FFmpegJS="node_modules/@ffmpeg/ffmpeg/dist/umd/ffmpeg.js"
          FFmpegWorker="node_modules/@ffmpeg/ffmpeg/dist/umd/814.ffmpeg.js"
          FFmpegCoreJS="node_modules/@ffmpeg/core/dist/umd/ffmpeg-core.js"
          FFmpegWASM="node_modules/@ffmpeg/core/dist/umd/ffmpeg-core.wasm"

          echo "Checking:"
          echo "$FFmpegJS"
          echo "$FFmpegWorker"
          echo "$FFmpegCoreJS"
          echo "$FFmpegWASM"

          if [ ! -f "$FFmpegJS" ]; then
            echo "ERROR: ffmpeg.js not found"
            exit 1
          fi

          if [ ! -f "$FFmpegWorker" ]; then
            echo "ERROR: 814.ffmpeg.js not found"
            exit 1
          fi

          if [ ! -f "$FFmpegCoreJS" ]; then
            echo "ERROR: ffmpeg-core.js not found"
            exit 1
          fi

          if [ ! -f "$FFmpegWASM" ]; then
            echo "ERROR: ffmpeg-core.wasm not found"
            exit 1
          fi

          echo ""
          echo "✓ ffmpeg.js found"
          echo "✓ 814.ffmpeg.js found"
          echo "✓ ffmpeg-core.js found"
          echo "✓ ffmpeg-core.wasm found"

      # 6. Создаём папку сайта
      - name: Build static site
        shell: bash
        run: |
          rm -rf dist

          mkdir -p dist
          mkdir -p dist/vendor

          echo "Copying AURA Video Editor..."

          cp index.html dist/index.html

          echo "Copying FFmpeg files..."

          cp node_modules/@ffmpeg/ffmpeg/dist/umd/ffmpeg.js \
             dist/vendor/ffmpeg.js

          cp node_modules/@ffmpeg/ffmpeg/dist/umd/814.ffmpeg.js \
             dist/vendor/814.ffmpeg.js

          cp node_modules/@ffmpeg/core/dist/umd/ffmpeg-core.js \
             dist/vendor/ffmpeg-core.js

          cp node_modules/@ffmpeg/core/dist/umd/ffmpeg-core.wasm \
             dist/vendor/ffmpeg-core.wasm

          # Отключаем обработку Jekyll
          touch dist/.nojekyll

          echo ""
          echo "=== Final dist structure ==="

          find dist -maxdepth 2 -type f -print

      # 7. Финальная проверка перед публикацией
      - name: Verify final build
        shell: bash
        run: |
          echo "Checking final files..."

          test -f dist/index.html
          test -f dist/vendor/ffmpeg.js
          test -f dist/vendor/814.ffmpeg.js
          test -f dist/vendor/ffmpeg-core.js
          test -f dist/vendor/ffmpeg-core.wasm

          echo ""
          echo "✓ dist/index.html"
          echo "✓ dist/vendor/ffmpeg.js"
          echo "✓ dist/vendor/814.ffmpeg.js"
          echo "✓ dist/vendor/ffmpeg-core.js"
          echo "✓ dist/vendor/ffmpeg-core.wasm"

          echo ""
          echo "=== File sizes ==="

          ls -lh \
            dist/index.html \
            dist/vendor/ffmpeg.js \
            dist/vendor/814.ffmpeg.js \
            dist/vendor/ffmpeg-core.js \
            dist/vendor/ffmpeg-core.wasm

          echo ""
          echo "AURA BUILD SUCCESSFUL"

      # 8. Настраиваем GitHub Pages
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      # 9. Загружаем готовый сайт в GitHub Pages
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  # ==========================================================
  # DEPLOY
  # ==========================================================

  deploy:
    name: Deploy AURA Video Editor
    runs-on: ubuntu-latest

    needs:
      - build

    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
