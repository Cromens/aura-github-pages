<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">

<title>AURA Video Editor</title>

<style>
:root{
  --bg:#0b0d12;
  --panel:rgba(40,40,40,.15);
  --panel-strong:rgba(40,40,40,.23);
  --border:rgba(110,110,110,.15);
  --border-strong:rgba(255,255,255,.12);
  --button:#282828;
  --buttonText:#6E6E6E;
  --primary:#053a99;
  --accent:#1677ff;
  --muted:#778398;
  --white:#fff;
}

*{
  box-sizing:border-box;
}

html,
body{
  width:100%;
  height:100%;
  margin:0;
  overflow:hidden;
}

body{
  background:
    radial-gradient(circle at 50% -20%, rgba(40,72,130,.18), transparent 48%),
    linear-gradient(135deg,#090b10 0%,#0f1219 52%,#080a0f 100%);
  color:var(--white);
  font-family:
    Inter,
    system-ui,
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    sans-serif;
  font-size:12px;
  -webkit-font-smoothing:antialiased;
}

button,
input{
  font-family:inherit;
}

button{
  border:0;
}

#app{
  width:100%;
  height:100%;
  padding:10px;
  display:flex;
  flex-direction:column;
  gap:8px;
  overflow:hidden;
}

/* =====================================================
   PANELS
===================================================== */

.panel{
  background:var(--panel);
  border:1px solid var(--border);
  border-radius:15px;
  min-width:0;
  backdrop-filter:blur(15px) saturate(125%);
  -webkit-backdrop-filter:blur(15px) saturate(125%);
  box-shadow:
    inset 0 1px 0 rgba(255,255,255,.045),
    0 14px 40px rgba(0,0,0,.18);
}

/* =====================================================
   AURA BRAND
===================================================== */

.aura-brand{
  height:32px;
  min-width:78px;
  padding:0 12px;
  display:flex;
  align-items:center;
  justify-content:center;
  border-radius:10px;
  color:#fff;
  text-decoration:none;
  font-size:14px;
  font-weight:800;
  letter-spacing:.16em;
  background:rgba(40,40,40,.24);
  border:1px solid rgba(110,110,110,.16);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.06);
  backdrop-filter:blur(15px);
  -webkit-backdrop-filter:blur(15px);
  transition:.18s ease;
}

.aura-brand:hover{
  color:#fff;
  background:rgba(40,40,40,.38);
  border-color:rgba(255,255,255,.18);
  transform:translateY(-1px);
}

/* =====================================================
   TOOLBAR
===================================================== */

.toolbar{
  height:52px;
  min-height:52px;
  display:flex;
  align-items:center;
  gap:5px;
  padding:7px 9px;
  overflow:hidden;
}

.tool{
  height:30px;
  min-width:30px;
  padding:0 10px;
  border-radius:9px;
  background:rgba(40,40,40,.22);
  color:var(--buttonText);
  display:flex;
  align-items:center;
  justify-content:center;
  gap:7px;
  cursor:pointer;
  white-space:nowrap;
  font-size:11px;
  font-weight:650;
  border:1px solid rgba(110,110,110,.15);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.035);
  backdrop-filter:blur(15px);
  -webkit-backdrop-filter:blur(15px);
  transition:.15s ease;
}

.tool:hover{
  filter:brightness(1.25);
}

.tool:disabled{
  opacity:.45;
  cursor:not-allowed;
}

.tool.active{
  background:var(--primary);
  color:#fff;
}

.tool.icon{
  width:30px;
  padding:0;
}

.tool svg{
  width:16px;
  height:16px;
  fill:none;
  stroke:currentColor;
  stroke-width:1.9;
}

.sep{
  width:1px;
  height:24px;
  background:rgba(255,255,255,.08);
  margin:0 4px;
}

.toolbar-spacer{
  flex:1;
}

#fileInput{
  display:none;
}

/* =====================================================
   MAIN
===================================================== */

.main{
  flex:1;
  min-height:0;
  display:flex;
  flex-direction:column;
  gap:8px;
  overflow:hidden;
}

/* =====================================================
   PREVIEW
===================================================== */

.preview-panel{
  flex:1;
  min-height:150px;
  position:relative;
  display:flex;
  align-items:center;
  justify-content:center;
  overflow:hidden;
  background:#080b11;
}

.preview-stage{
  position:relative;
  width:min(78%,calc(100% - 20px));
  height:calc(100% - 20px);
  display:flex;
  align-items:center;
  justify-content:center;
  overflow:hidden;
}

video{
  display:block;
  max-width:100%;
  max-height:100%;
  width:auto;
  height:auto;
  object-fit:contain;
  user-select:none;
}

.empty{
  position:absolute;
  inset:0;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:9px;
  color:var(--muted);
  pointer-events:none;
}

.empty strong{
  color:#c0c8d8;
  font-size:14px;
}

.empty span{
  font-size:10px;
}

/* =====================================================
   CROP
===================================================== */

.crop-box{
  position:absolute;
  display:none;
  border:2px solid rgba(255,255,255,.95);
  box-shadow:
    0 0 0 9999px rgba(0,0,0,.48),
    0 0 20px rgba(22,119,255,.28);
  z-index:20;
  touch-action:none;
  cursor:move;
  user-select:none;
}

.crop-box .lineV,
.crop-box .lineH{
  position:absolute;
  background:rgba(255,255,255,.18);
  pointer-events:none;
}

.crop-box .lineV{
  top:0;
  bottom:0;
  width:1px;
}

.crop-box .lineV.v1{
  left:33.333%;
}

.crop-box .lineV.v2{
  left:66.666%;
}

.crop-box .lineH{
  left:0;
  right:0;
  height:1px;
}

.crop-box .lineH.h1{
  top:33.333%;
}

.crop-box .lineH.h2{
  top:66.666%;
}

.handle{
  position:absolute;
  width:22px;
  height:22px;
  background:rgba(255,255,255,.98);
  border:2px solid #1677ff;
  border-radius:6px;
  box-shadow:
    0 2px 10px rgba(0,0,0,.55),
    0 0 0 1px rgba(255,255,255,.28);
  z-index:30;
  touch-action:none;
}

.handle::after{
  content:"";
  position:absolute;
  inset:5px;
  border-radius:3px;
  background:#1677ff;
}


.handle.tl{
  left:-11px;
  top:-11px;
  cursor:nwse-resize;
}

.handle.tr{
  right:-11px;
  top:-11px;
  cursor:nesw-resize;
}

.handle.bl{
  left:-11px;
  bottom:-11px;
  cursor:nesw-resize;
}

.handle.br{
  right:-11px;
  bottom:-11px;
  cursor:nwse-resize;
}

/* =====================================================
   STATUS
===================================================== */

.status{
  position:absolute;
  left:50%;
  bottom:9px;
  transform:translateX(-50%);
  background:rgba(0,0,0,.8);
  color:#dce5f2;
  padding:7px 13px;
  border-radius:8px;
  font-size:10px;
  z-index:100;
  display:none;
  pointer-events:none;
  white-space:nowrap;
}

.status.show{
  display:block;
}

.engine{
  position:absolute;
  top:8px;
  left:50%;
  transform:translateX(-50%);
  background:rgba(0,0,0,.7);
  color:#aab6c9;
  padding:5px 10px;
  border-radius:7px;
  font-size:9px;
  display:none;
  z-index:100;
}

.engine.show{
  display:block;
}

.progress{
  position:absolute;
  left:0;
  right:0;
  bottom:0;
  height:3px;
  background:rgba(255,255,255,.08);
  z-index:90;
}

.progress i{
  display:block;
  height:100%;
  width:0;
  background:var(--accent);
  transition:width .15s;
}

/* =====================================================
   DOWNLOAD
===================================================== */

.download-panel{
  position:absolute;
  inset:0;
  display:none;
  align-items:center;
  justify-content:center;
  flex-direction:column;
  gap:10px;
  background:rgba(5,8,13,.58);
  border:1px solid rgba(255,255,255,.08);
  backdrop-filter:blur(15px) saturate(130%);
  z-index:150;
}

.download-panel.show{
  display:flex;
}

.download-title{
  font-size:14px;
  font-weight:700;
}

.download-subtitle{
  font-size:10px;
  color:#8793a8;
  margin-bottom:4px;
}

.download-main,
.download-open{
  min-width:190px;
  padding:11px 18px;
  border-radius:10px;
  cursor:pointer;
  font-weight:700;
}

.download-main{
  background:var(--primary);
  color:#fff;
}

.download-open{
  background:var(--primary);
  color:#fff;
}

.download-main:hover,
.download-open:hover{
  filter:brightness(1.12);
}

/* =====================================================
   CROP PANEL
===================================================== */

.crop-panel{
  display:none;
  min-height:82px;
  padding:10px 14px;
}

.crop-panel.show{
  display:block;
}

.crop-header{
  display:flex;
  justify-content:space-between;
  margin-bottom:8px;
}

.crop-header strong{
  font-size:12px;
}

.crop-header span{
  color:var(--muted);
  font-size:10px;
}

.crop-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:7px 24px;
}

.range-row{
  display:grid;
  grid-template-columns:65px 1fr 43px;
  gap:8px;
  align-items:center;
  color:#aeb8c9;
}

.range-row input{
  width:100%;
  accent-color:#1677ff;
}

.range-val{
  height:25px;
  border-radius:7px;
  background:rgba(0,0,0,.22);
  display:flex;
  align-items:center;
  justify-content:center;
  color:#bac5d7;
  font-size:10px;
}

/* =====================================================
   TIMELINE
===================================================== */

.timeline{
  height:78px;
  min-height:78px;
  padding:7px 10px;
  display:flex;
  flex-direction:column;
  gap:5px;
  background:rgba(7,10,16,.48);
  backdrop-filter:blur(15px);
  -webkit-backdrop-filter:blur(15px);
}

.film{
  flex:1;
  min-height:0;
  position:relative;
  overflow:hidden;
  border-radius:6px;
  background:#020305;
}

.thumbs{
  width:100%;
  height:100%;
  display:flex;
  overflow:hidden;
}

.thumb{
  flex:1;
  min-width:0;
  height:100%;
  object-fit:cover;
  opacity:.75;
}

.trim-fill{
  position:absolute;
  top:0;
  bottom:0;
  background:rgba(22,119,255,.13);
  border-left:2px solid rgba(22,119,255,.75);
  border-right:2px solid rgba(22,119,255,.75);
  pointer-events:none;
}

.trim-handle{
  position:absolute;
  top:-1px;
  bottom:-1px;
  width:20px;
  transform:translateX(-50%);
  border-radius:7px;
  background:var(--accent);
  box-shadow:0 0 8px rgba(33,199,255,.35);
  cursor:ew-resize;
  z-index:20;
}

.trim-handle:after{
  content:"";
  position:absolute;
  left:50%;
  top:18%;
  bottom:18%;
  width:4px;
  transform:translateX(-50%);
  border-radius:3px;
  background:#fff;
  box-shadow:0 0 7px rgba(255,255,255,.45);
}

/* Реальный ползунок текущего кадра видео */
.playhead{
  position:absolute;
  top:-2px;
  bottom:-2px;
  width:18px;
  transform:translateX(-50%);
  z-index:32;
  cursor:ew-resize;
  touch-action:none;
}

.playhead::before{
  content:"";
  position:absolute;
  left:50%;
  top:0;
  bottom:0;
  width:2px;
  transform:translateX(-50%);
  background:#fff;
  box-shadow:
    0 0 0 1px rgba(0,0,0,.35),
    0 0 9px rgba(255,255,255,.7);
}

.playhead::after{
  content:"";
  position:absolute;
  left:50%;
  top:-1px;
  width:9px;
  height:9px;
  transform:translate(-50%,-50%);
  border-radius:50%;
  background:#fff;
  box-shadow:0 0 0 2px #1677ff,0 0 10px rgba(22,119,255,.65);
}

.time-scale{
  display:flex;
  justify-content:space-between;
  color:#536078;
  font-size:9px;
}

/* =====================================================
   BOTTOM
===================================================== */

.bottom{
  height:48px;
  min-height:48px;
  display:flex;
  align-items:center;
  gap:8px;
}

.play{
  width:56px;
  height:100%;
  border-radius:11px;
  background:var(--button);
  color:#8e99ab;
  cursor:pointer;
  display:flex;
  align-items:center;
  justify-content:center;
}

.play:disabled{
  opacity:.45;
  cursor:not-allowed;
}

.play svg{
  width:17px;
  height:17px;
  fill:currentColor;
}

.time-inputs{
  height:100%;
  display:flex;
  align-items:center;
  gap:7px;
  padding:0 10px;
  border-radius:11px;
  background:var(--button);
}

.time-inputs input{
  width:70px;
  height:28px;
  border:0;
  outline:0;
  border-radius:7px;
  background:rgba(0,0,0,.17);
  color:#fff;
  text-align:center;
  font-size:11px;
}

.file-info{
  color:#69758b;
  font-size:10px;
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
}

.bottom-spacer{
  flex:1;
}

.save{
  min-width:125px;
  height:100%;
  border-radius:11px;
  background:#053A99;
  color:#fff;
  border:1px solid rgba(255,255,255,.12);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.08);
  font-weight:700;
  cursor:pointer;
}

.save:disabled{
  opacity:.5;
  cursor:not-allowed;
}

/* =====================================================
   MOBILE
===================================================== */

@media(max-width:700px){

  .aura-brand{min-width:64px;padding:0 9px;font-size:12px;}
  .toolbar .sep{margin:0 1px;}

  #app{
    padding:6px;
    gap:6px;
  }

  .toolbar{
    height:44px;
    min-height:44px;
  }

  .tool{
    padding:0 7px;
  }

  .tool span{
    display:none;
  }

  .preview-stage{
    width:95%;
    height:calc(100% - 10px);
  }

  .crop-grid{
    gap:6px;
  }

  .range-row{
    grid-template-columns:43px 1fr 40px;
  }

  .file-info{
    display:none;
  }

  .save{
    min-width:100px;
  }
}

/* AURA GLASS SYSTEM — FINAL OVERRIDES */
.panel{
  background:rgba(40,40,40,.15);
  border:1px solid rgba(110,110,110,.15);
  backdrop-filter:blur(15px) saturate(125%);
  -webkit-backdrop-filter:blur(15px) saturate(125%);
  box-shadow:
    inset 0 1px 0 rgba(255,255,255,.045),
    0 14px 40px rgba(0,0,0,.18);
}

.tool,
.play,
.time-inputs{
  background:rgba(40,40,40,.22);
  color:#6E6E6E;
  border:1px solid rgba(110,110,110,.15);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.035);
  backdrop-filter:blur(15px);
  -webkit-backdrop-filter:blur(15px);
}

.tool svg,
.play svg{
  stroke:currentColor;
}

.tool.active,
#chooseBtn,
.save,
.download-main{
  background:#053A99 !important;
  color:#fff !important;
}

.tool:not(.active):hover,
.play:hover{
  background:rgba(48,48,48,.38);
  color:#fff;
}

.crop-box{
  border:2px solid rgba(255,255,255,.96);
  box-shadow:
    0 0 0 9999px rgba(0,0,0,.48),
    0 0 20px rgba(22,119,255,.28);
  cursor:move;
}

.crop-box .lineV,
.crop-box .lineH{
  background:rgba(255,255,255,.28);
}

.handle{
  width:22px;
  height:22px;
  border:2px solid #1677ff;
  border-radius:6px;
  background:rgba(255,255,255,.98);
  box-shadow:
    0 2px 10px rgba(0,0,0,.55),
    0 0 0 1px rgba(255,255,255,.28);
}

.handle::after{
  content:"";
  position:absolute;
  inset:5px;
  border-radius:3px;
  background:#1677ff;
}

.handle.tl{left:-11px;top:-11px}
.handle.tr{right:-11px;top:-11px}
.handle.bl{left:-11px;bottom:-11px}
.handle.br{right:-11px;bottom:-11px}

.trim-handle{
  width:20px;
  transform:translateX(-50%);
  border-radius:7px;
  background:#1677ff;
  box-shadow:
    0 0 0 1px rgba(255,255,255,.16),
    0 0 12px rgba(22,119,255,.45);
}

.trim-handle:after{
  left:50%;
  transform:translateX(-50%);
  width:4px;
  background:#fff;
  box-shadow:0 0 7px rgba(255,255,255,.45);
}

.playhead{
  z-index:32;
}

.crop-panel{
  padding:11px 14px;
  min-height:88px;
}

.crop-presets{
  display:flex;
  gap:7px;
  flex-wrap:wrap;
  align-items:center;
}

.crop-preset{
  border:1px solid rgba(110,110,110,.15);
  background:rgba(40,40,40,.22);
  color:#6E6E6E;
  border-radius:9px;
  padding:8px 11px;
  cursor:pointer;
  font-size:10px;
  font-weight:700;
  transition:.15s ease;
  backdrop-filter:blur(15px);
  -webkit-backdrop-filter:blur(15px);
}

.crop-preset:hover,
.crop-preset.active{
  background:#053A99;
  color:#fff;
  border-color:rgba(255,255,255,.16);
}

.crop-hint{
  color:#6E6E6E;
  font-size:10px;
  margin-left:auto;
}

.download-panel{
  backdrop-filter:blur(15px) saturate(130%);
  -webkit-backdrop-filter:blur(15px) saturate(130%);
}

.save{
  background:#053A99;
  color:#fff;
}

</style>
</head>

<body>

<div id="app">

  <!-- =================================================
       TOOLBAR
  ================================================== -->

  <div class="panel toolbar">

    <a
      class="aura-brand"
      href="https://cromens.wixstudio.com/brachka/login"
      target="_blank"
      rel="noopener noreferrer"
      title="Открыть AURA"
    >AURA</a>

    <div class="sep"></div>

    <button class="tool icon" id="cropBtn" title="Кадрирование">

      <svg viewBox="0 0 24 24">
        <path d="M7 3v14a2 2 0 0 0 2 2h14"/>
        <path d="M17 21V7a2 2 0 0 0-2-2H1"/>
      </svg>

    </button>

    <button class="tool icon" id="rotateBtn" title="Повернуть">

      <svg viewBox="0 0 24 24">
        <path d="M4 12a8 8 0 1 0 2.3-5.7"/>
        <path d="M4 4v6h6"/>
      </svg>

    </button>

    <button class="tool icon" id="mirrorBtn" title="Отразить">

      <svg viewBox="0 0 24 24">
        <path d="M12 3v18"/>
        <path d="M4 6l6 6-6 6z"/>
        <path d="M20 6l-6 6 6 6z"/>
      </svg>

    </button>

    <button class="tool icon" id="muteBtn" title="Без звука">

      <svg viewBox="0 0 24 24">
        <path d="M4 10v4h4l5 4V6l-5 4H4z"/>
        <path d="M17 9l4 6M21 9l-4 6"/>
      </svg>

    </button>
<div class="toolbar-spacer"></div>

    <button
      class="tool"
      id="chooseBtn"
      style="background:#053a99;color:#fff;"
    >

      <svg viewBox="0 0 24 24">
        <path d="M12 3v12"/>
        <path d="m7 8 5-5 5 5"/>
        <path d="M5 13v6h14v-6"/>
      </svg>

      <span>Загрузить</span>

    </button>

    <input
      id="fileInput"
      type="file"
      accept="video/*,.mp4,.mov,.webm,.m4v,.mkv,.avi"
    >

  </div>


  <!-- =================================================
       MAIN
  ================================================== -->

  <div class="main">

    <!-- PREVIEW -->

    <div class="panel preview-panel">

      <div class="preview-stage" id="stage">

        <video
          id="video"
          playsinline
          preload="metadata"
        ></video>

        <div class="empty" id="empty">

          <strong>AURA Video Editor</strong>

          <span>
            Загрузите MP4 / MOV / WebM
          </span>

        </div>

        <!-- CROP BOX -->

        <div class="crop-box" id="cropBox">

          <div class="lineV v1"></div>
          <div class="lineV v2"></div>

          <div class="lineH h1"></div>
          <div class="lineH h2"></div>

          <i class="handle tl" data-h="tl"></i>
          <i class="handle tr" data-h="tr"></i>
          <i class="handle bl" data-h="bl"></i>
          <i class="handle br" data-h="br"></i>

        </div>


        <div class="engine" id="engine">
          FFmpeg не загружен
        </div>


        <div class="status" id="status"></div>


        <div class="progress">
          <i id="progressBar"></i>
        </div>


        <!-- DOWNLOAD WINDOW -->

        <div
          class="download-panel"
          id="downloadPanel"
        >

          <div class="download-title">
            Видео готово
          </div>

          <div class="download-subtitle">
            Выберите способ сохранения MP4
          </div>

          <button
            class="download-main"

/* =====================================================

===================================================== */

function formatTime(seconds){

  seconds =
    Math.max(
      0,
      Number(seconds) || 0
    );

  const minutes =
    Math.floor(
      seconds / 60
    );

  const secs =
    seconds -
    minutes * 60;

  return (
    String(minutes)
      .padStart(2,"0")
    +
    ":"
    +
    secs
      .toFixed(1)
      .padStart(4,"0")
  );
}


function parseTime(value){

  const text =
    String(value || "")
      .trim();

  if(
    text.includes(":")
  ){

    const parts =
      text.split(":");

    return Math.max(
      0,
      Number(parts[0] || 0) * 60 +
      Number(parts[1] || 0)
    );

  }

  return Math.max(
    0,
    Number(text) || 0
  );
}


function setStatus(
  text,
  visible = true
){

  status.textContent =
    text || "";

  status.classList.toggle(
    "show",
    visible && !!text
  );
}


function setProgress(percent){

  percent =
    Math.max(
      0,
      Math.min(
        100,
        Number(percent) || 0
      )
    );

  progressBar.style.width =
    percent + "%";
}


function revokeURL(url){

  if(!url)
    return;

  try{
    URL.revokeObjectURL(url);
  }catch(e){}
}


function fileBaseName(name){

/* =====================================================

function getFFmpegClass(){

  /*
   * Different UMD builds/browser setups
   * can expose the class under different
   * global names.
   */

  if(
    window.FFmpegWASM &&
    typeof window.FFmpegWASM.FFmpeg ===
      "function"
  ){

    return window.FFmpegWASM.FFmpeg;

  }


  if(
    window.FFmpeg &&
    typeof window.FFmpeg.FFmpeg ===
      "function"
  ){

    return window.FFmpeg.FFmpeg;

  }


  if(
    typeof window.FFmpeg ===
      "function"
  ){

    return window.FFmpeg;

  }


  return null;
}


/* =====================================================
   BLOB URL LOADER
===================================================== */

/*
 * We intentionally implement the equivalent
 * of ffmpeg util's toBlobURL ourselves.
 *
 * This avoids loading another UMD package
 * into the Wix iframe.
 */

async function downloadAsBlobURL(
  urls,
  mime
){
  const list = Array.isArray(urls) ? urls : [urls];
  let lastError = null;

  for(const url of list){
    try{
      console.log("AURA: loading FFmpeg resource:", url);

      const response = await fetch(
        url,
        {
          mode:"cors",
          cache:"force-cache"
        }
      );

      if(!response.ok){
        throw new Error("HTTP " + response.status);
      }

      const blob = await response.blob();

      if(!blob.size){
        throw new Error("Пустой ресурс");
      }

      console.log(
        "AURA: FFmpeg resource loaded:",
        url,
        blob.size,
        "bytes"
      );

      return URL.createObjectURL(
        new Blob([blob], {type:mime})
      );
    }catch(error){
      lastError = error;
      console.warn(
        "AURA: CDN failed:",
        url,
        error
      );
    }
  }

  throw new Error(
    "Не удалось загрузить ресурс FFmpeg ни с одного CDN. " +
    (lastError && lastError.message
      ? lastError.message
      : "Неизвестная ошибка")
  );
}


/* =====================================================
   LOAD FFMPEG
===================================================== */

async function loadFFmpeg(){

  if(ffmpegLoaded)
    return true;

  if(ffmpegLoading){
    while(ffmpegLoading){
      await new Promise(resolve => setTimeout(resolve,100));
    }
    return ffmpegLoaded;
  }

  ffmpegLoading = true;

  engine.classList.add("show");
  engine.textContent = "Загрузка FFmpeg…";
  setStatus("Загрузка видеодвижка…", true);

  let workerBlobURL = null;

  try{

    const FFmpegClass = getFFmpegClass();

    if(!FFmpegClass){
      throw new Error(
        "Класс FFmpeg не найден. Проверьте vendor/ffmpeg.js."
      );
    }

    ffmpeg = new FFmpegClass();

    try{
      ffmpeg.on("log", ({message}) => {
        console.log("[AURA FFmpeg]", message);
      });
    }catch(e){}

    try{
      ffmpeg.on("progress", ({progress}) => {
        if(isExporting && typeof progress === "number"){
          setProgress(Math.min(95, Math.max(0, progress * 95)));
        }
      });
    }catch(e){}

    engine.textContent = "Подключение FFmpeg core…";

    /*
     * ВАЖНО.
     *
     * Ошибка на скриншоте:
     *   Error: failed to import ffmpeg-core.js
     *
     * Возникала потому, что предыдущая версия пыталась
     * запускать локальный core через UMD/worker-связку 0.12.10.
     *
     * Для браузерного worker используем официальный ESM core.
     * Это особенно важно для GitHub Pages/Wix iframe.
     *
     * Core и WASM берём из одной версии 0.12.10.
     * Worker самого @ffmpeg/ffmpeg превращаем в Blob URL,
     * поэтому браузер не блокирует его как cross-origin Worker.
     */

    const CORE_URL =
      "https://cdn.jsdelivr.net/npm/@ffmpeg/core@0.12.10/dist/esm/ffmpeg-core.js";

    const WASM_URL =
      "https://cdn.jsdelivr.net/npm/@ffmpeg/core@0.12.10/dist/esm/ffmpeg-core.wasm";

    const WORKER_URL =
      "https://cdn.jsdelivr.net/npm/@ffmpeg/ffmpeg@0.12.10/dist/umd/814.ffmpeg.js";

    console.log("AURA FFmpeg URLs:", {
      coreURL: CORE_URL,
      wasmURL: WASM_URL,
      workerSource: WORKER_URL,
      sharedArrayBufferRequired: false
    });

    /*
     * Скачиваем 814.ffmpeg.js и создаём локальный Blob Worker.
     * Это обходит ограничение браузера на Worker с другого origin.
     */

    const workerResponse = await fetch(
      WORKER_URL,
      {
        mode: "cors",
        cache: "force-cache"
      }
    );

    if(!workerResponse.ok){
      throw new Error(
        "Не удалось загрузить FFmpeg worker: HTTP " +
        workerResponse.status
      );
    }

    const workerCode = await workerResponse.text();

    if(!workerCode || workerCode.length < 1000){
      throw new Error(
        "FFmpeg worker загрузился пустым или повреждённым."
      );
    }

    workerBlobURL = URL.createObjectURL(
      new Blob(
        [workerCode],
        {type:"text/javascript"}
      )
    );

    console.log(
      "AURA: FFmpeg worker prepared as Blob URL."
    );

    engine.textContent = "Загрузка ядра FFmpeg…";

    /*
     * НЕ используем classWorkerURL как относительный путь.
     * НЕ используем file://.
     * НЕ используем SharedArrayBuffer.
     */

    await ffmpeg.load({
      coreURL: CORE_URL,
      wasmURL: WASM_URL,
      classWorkerURL: workerBlobURL
    });

    ffmpegLoaded = true;

    engine.textContent = "FFmpeg готов";
    setStatus("", false);

    setTimeout(() => {
      engine.classList.remove("show");
    },1200);

    console.log(
      "AURA: FFmpeg " +
      FFMPEG_VERSION +
      " loaded successfully."
    );

    return true;

  }catch(error){

    console.error(
      "AURA FFmpeg load error:",
      error
    );

    ffmpegLoaded = false;
    ffmpeg = null;

    engine.textContent = "Ошибка FFmpeg";

    setStatus(
      "FFmpeg не удалось загрузить",
      true
    );

    alert(
      "Не удалось загрузить FFmpeg.\n\n" +
      "Причина:\n" +
      (error && error.message
        ? error.message
        : String(error)) +
      "\n\n" +
      "Попробуйте обновить страницу через Cmd + Shift + R."
    );

    return false;

  }finally{

    if(workerBlobURL){
      /*
       * Worker уже получил свой URL во время ffmpeg.load().
       * URL нельзя отзывать сразу после load(), потому что
       * экземпляр FFmpeg продолжает использовать Worker.
       * Поэтому оставляем его жить до закрытия страницы.
       */
    }

    ffmpegLoading = false;
  }
}


/* =====================================================

function loadVideoFile(file){

  const isVideo =
    file.type.startsWith(
      "video/"
    )
    ||
    /\.(mp4|mov|webm|m4v|mkv|avi)$/i
      .test(file.name);


  if(!isVideo){

    alert(
      "Выберите видеофайл."
    );

    return;
  }


  revokeURL(
    sourceURL
  );

  revokeURL(
    resultURL
  );


  sourceFile =
    file;


  sourceURL =
    URL.createObjectURL(
      file
    );


  resultBlob =
    null;

  resultURL =
    null;


  video.src =

  video.load();

    "none";


  fileInfo.textContent =

    " · " +
    (
      file.size /
      1024 /
      1024
    ).toFixed(1) +
    " MB";


  downloadPanel.classList.remove(
    "show"
  );


  setProgress(0);

  setStatus(
    "Загрузка видео…",

  );
}

/* =====================================================
   TRIM TIMELINE
===================================================== */

function updateTrimUI(){

  if(!duration){

    trimFill.style.left =
      "0%";

    trimFill.style.width =
      "100%";

    return;
  }


  const left =
    startTime /
    duration;

  const right =
    endTime /
    duration;


  trimFill.style.left =
    left * 100 +
    "%";


  trimFill.style.width =
    (right-left) *
    100 +
    "%";


  leftHandle.style.left =
    left * 100 +
    "%";


  rightHandle.style.left =
    right * 100 +
    "%";


  startInput.value =
    formatTime(
      startTime
    );

  endInput.value =
    formatTime(
      endTime
    );

  updatePlayhead();
}


function setTrim(
  side,
  clientX
){

  if(!duration)
    return;


  const rect =
    film.getBoundingClientRect();


  let percent =
    (
      clientX -
      rect.left
    ) /
    rect.width;


  percent =
    Math.max(
      0,
      Math.min(
        1,
        percent
      )
    );


  const time =
    percent *
    duration;


  if(side === "left"){

    startTime =
      Math.min(
        time,
        endTime - 0.05
      );

  }else{

    endTime =
      Math.max(
        time,
        startTime + 0.05
      );

  }


  updateTrimUI();

  /* Сразу показываем кадр на новом положении ручки */
  video.pause();
  video.currentTime =
    side === "left"
      ? startTime
      : endTime;

  updatePlayhead();
}


function startTrim(
  side,
  event
){

  if(isExporting)
    return;


  event.preventDefault();

  event.stopPropagation();


  pointerDrag = {
    type:"trim",
    side:side
  };


  document.addEventListener(
    "pointermove",
    pointerMove
  );


  document.addEventListener(
    "pointerup",
    pointerUp,
    {
      once:true
    }
  );
}


leftHandle.addEventListener(
  "pointerdown",
  event =>
    startTrim(
      "left",
      event
    )
);


rightHandle.addEventListener(
  "pointerdown",
  event =>
    startTrim(
      "right",
      event
    )
);


film.addEventListener(
  "pointerdown",
  event => {

    if(!duration || isExporting)
      return;

    if(
      event.target.closest(".trim-handle") ||
      event.target.closest(".playhead")
    )
      return;

    event.preventDefault();

    seekFromTimeline(event.clientX, false);

  }
);

function seekFromTimeline(clientX, keepTrimBounds){
  if(!duration) return;

  const rect = film.getBoundingClientRect();
  if(!rect.width) return;

  let percent =
    (clientX - rect.left) / rect.width;

  percent =
    Math.max(0, Math.min(1, percent));

  let time = percent * duration;

  if(keepTrimBounds){
    time = Math.max(
      startTime,
      Math.min(endTime, time)
    );
  }

  video.pause();
  video.currentTime = time;
  updatePlayhead();
}

playhead.addEventListener(
  "pointerdown",
  event => {
    if(!duration || isExporting) return;
    event.preventDefault();
    event.stopPropagation();

    pointerDrag = {
      type:"playhead"
    };

    video.pause();

    document.addEventListener(
      "pointermove",
      pointerMove
    );

    document.addEventListener(
      "pointerup",
      pointerUp,
      { once:true }
    );
  }
);

function updatePlayhead(){
  if(!playhead) return;

  if(!duration){
    playhead.style.left = "0%";
    return;
  }

  const percent =
    Math.max(0, Math.min(100,
      (video.currentTime / duration) * 100
    ));

  playhead.style.left =
    percent + "%";

  playhead.title =
    "Текущий кадр · " +
    formatTime(video.currentTime);
}


/* =====================================================
   TIME INPUTS
===================================================== */

startInput.addEventListener(
  "change",
  () => {

    startTime =
      Math.max(
        0,
        Math.min(
          parseTime(
            startInput.value
          ),
          endTime - 0.05
        )
      );


    updateTrimUI();
    video.pause();
    video.currentTime = startTime;
    updatePlayhead();

  }
);


endInput.addEventListener(
  "change",
  () => {

    endTime =
      Math.max(
        startTime + 0.05,
        Math.min(
          parseTime(
            endInput.value
          ),
          duration
        )
      );


    updateTrimUI();
    video.pause();
    video.currentTime = endTime;
    updatePlayhead();

  }
);


/* =====================================================
   POINTER
===================================================== */

function pointerMove(event){

  if(!pointerDrag)
    return;


  if(
    pointerDrag.type ===
    "trim"
  ){

    setTrim(
      pointerDrag.side,
      event.clientX
    );

    return;
  }

  if(
    pointerDrag.type ===
    "playhead"
  ){

    seekFromTimeline(
      event.clientX,
      false
    );

    return;
  }

  if(
    pointerDrag.type ===
    "cropMove"
  ){

    updateCropMove(event);
    return;
  }

  if(
    pointerDrag.type !==
    "crop"
  )
    return;


  updateCropFromPointer(
    event
  );
}


function pointerUp(){

  pointerDrag =
    null;


  document.removeEventListener(
    "pointermove",
    pointerMove
  );
}


/* =====================================================
   CROP
===================================================== */

function clampCrop(){
  crop.w=Math.max(5,Math.min(100,crop.w));
  crop.h=Math.max(5,Math.min(100,crop.h));
  crop.x=Math.max(0,Math.min(100-crop.w,crop.x));
  crop.y=Math.max(0,Math.min(100-crop.h,crop.y));
}

function updateCropUI(){
  clampCrop();
  positionCropBox();
}

function setCropPreset(ratioText){
  if(!video.videoWidth || !video.videoHeight) return;
  document.querySelectorAll(".crop-preset").forEach(b=>b.classList.remove("active"));
  const selected=document.querySelector(`.crop-preset[data-ratio="${ratioText}"]`);
  if(selected) selected.classList.add("active");

  if(ratioText==="free"){
    cropMode=true;
    return updateCropUI();
  }

  const [rw,rh]=ratioText.split(":").map(Number);
  const videoRatio=video.videoWidth/video.videoHeight;
  let w=100,h=100;

  if(videoRatio>rw/rh){
    w=(videoRatio/(rw/rh))*100;
    if(w>100){w=100;h=(videoRatio*rh/rw)?100:100;}
    // Fit desired ratio inside the video
    h=100;
    w=(rw/rh)/videoRatio*100;
  }else{
    w=100;
    h=videoRatio/(rw/rh)*100;
  }
  w=Math.max(5,Math.min(100,w));
  h=Math.max(5,Math.min(100,h));
  crop.w=w; crop.h=h;
  crop.x=(100-w)/2; crop.y=(100-h)/2;
  updateCropUI();
}

document.querySelectorAll(".crop-preset").forEach(btn=>{
  btn.addEventListener("click",()=>{
    if(!sourceFile) return;
    setCropPreset(btn.dataset.ratio);
  });
});

cropBtn.onclick=()=>{
  if(!sourceFile) return;
  cropMode=!cropMode;
  cropBtn.classList.toggle("active",cropMode);
  cropPanel.classList.toggle("show",cropMode);
  cropBox.style.display=cropMode?"block":"none";
  if(cropMode) positionCropBox();
};

/* =====================================================
   CROP POSITION
===================================================== */

function getVideoRect(){

  const vr =
    video.getBoundingClientRect();

  const sr =
    stage.getBoundingClientRect();


  return {
    left:
      vr.left - sr.left,

    top:
      vr.top - sr.top,

    width:
      vr.width,

    height:
      vr.height
  };
}


function positionCropBox(){

  if(
    !cropMode ||
    !video.videoWidth
  )
    return;


  const r =
    getVideoRect();


  cropBox.style.left =
    r.left +
    r.width *
    crop.x /
    100 +
    "px";


  cropBox.style.top =
    r.top +
    r.height *
    crop.y /
    100 +
    "px";


  cropBox.style.width =
    r.width *
    crop.w /
    100 +
    "px";


  cropBox.style.height =
    r.height *
    crop.h /
    100 +
    "px";
}


window.addEventListener(
  "resize",
  positionCropBox
);


/* =====================================================
   CROP HANDLES + MOVE WHOLE GRID
===================================================== */

document.querySelectorAll(".handle").forEach(handle=>{
  handle.addEventListener("pointerdown",event=>{
    if(isExporting || !cropMode) return;
    event.preventDefault(); event.stopPropagation();
    pointerDrag={type:"crop",handle:handle.dataset.h};
    document.addEventListener("pointermove",pointerMove);
    document.addEventListener("pointerup",pointerUp,{once:true});
  });
});

cropBox.addEventListener("pointerdown",event=>{
  if(isExporting || !cropMode) return;
  if(event.target.classList.contains("handle")) return;
  event.preventDefault(); event.stopPropagation();
  pointerDrag={
    type:"cropMove",
    startX:event.clientX,
    startY:event.clientY,
    cropX:crop.x,cropY:crop.y
  };
  document.addEventListener("pointermove",pointerMove);
  document.addEventListener("pointerup",pointerUp,{once:true});
});

function updateCropFromPointer(event){
  const rect=video.getBoundingClientRect();
  if(!rect.width || !rect.height) return;
  let x=(event.clientX-rect.left)/rect.width*100;
  let y=(event.clientY-rect.top)/rect.height*100;
  x=Math.max(0,Math.min(100,x));
  y=Math.max(0,Math.min(100,y));

  const handle=pointerDrag.handle, minimum=5;
  if(handle.includes("l")){
    const right=crop.x+crop.w;
    crop.x=Math.min(x,right-minimum); crop.w=right-crop.x;
  }
  if(handle.includes("r")){
    crop.w=Math.max(minimum,Math.min(100-crop.x,x-crop.x));
  }
  if(handle.includes("t")){
    const bottom=crop.y+crop.h;
    crop.y=Math.min(y,bottom-minimum); crop.h=bottom-crop.y;
  }
  if(handle.includes("b")){
    crop.h=Math.max(minimum,Math.min(100-crop.y,y-crop.y));
  }
  updateCropUI();
}

function updateCropMove(event){
  const rect=video.getBoundingClientRect();
  if(!rect.width || !rect.height) return;
  const dx=(event.clientX-pointerDrag.startX)/rect.width*100;
  const dy=(event.clientY-pointerDrag.startY)/rect.height*100;
  crop.x=Math.max(0,Math.min(100-crop.w,pointerDrag.cropX+dx));
  crop.y=Math.max(0,Math.min(100-crop.h,pointerDrag.cropY+dy));
  updateCropUI();
}

/* =====================================================
   ROTATE / MIRROR / MUTE
===================================================== */

rotateBtn.onclick =

function applyPreviewTransform(){

  let transform = "";


  if(rotate){

    transform +=
      "rotate(" +
      rotate +
      "deg) ";

  }


  transform +=
    "scaleX(" +
    (
      mirror
        ? -1
        : 1
    ) +
    ")";


  video.style.transform =
    transform;


  video.muted =
    muted;
}

/* =====================================================
   THUMBNAILS
===================================================== */

function createThumbnails(){

  thumbs.innerHTML =
    "";


  if(
    !sourceURL ||
    !duration
  )
    return;


  const count =
    Math.min(
      28,
      Math.max(
        8,
        Math.round(
          duration / 4
        )
      )
    );


  const thumbVideo =
    document.createElement(
      "video"
    );


  thumbVideo.muted =
    true;

  thumbVideo.preload =
    "metadata";

  thumbVideo.src =
    sourceURL;


  thumbVideo.addEventListener(
    "loadedmetadata",
    () => {

      const canvas =
        document.createElement(
          "canvas"
        );


      canvas.width =
        160;

      canvas.height =
        90;


      const ctx =
        canvas.getContext(
          "2d"
        );


      let index =
        0;


      function drawNext(){

        if(index >= count){

          try{
            thumbVideo.src =
              "";
          }catch(e){}

          return;
        }


        const time =
          duration *
          (
            index /
            Math.max(
              1,
              count - 1
            )
          );


        thumbVideo.currentTime =
          Math.min(
            duration - 0.01,
            time
          );


        thumbVideo.addEventListener(
          "seeked",
          function handler(){

            thumbVideo.removeEventListener(
              "seeked",
              handler
            );


            try{

              const ratio =
                thumbVideo.videoWidth /
                Math.max(
                  1,
                  thumbVideo.videoHeight
                );


              canvas.height =
                Math.max(
                  60,
                  Math.round(
                    canvas.width /
                    ratio
                  )
                );


              ctx.drawImage(
                thumbVideo,
                0,
                0,
                canvas.width,
                canvas.height
              );


              const image =
                document.createElement(
                  "img"
                );


              image.className =
                "thumb";


              image.src =
                canvas.toDataURL(
                  "image/jpeg",
                  .55
                );


              thumbs.appendChild(
                image
              );

            }catch(error){

              console.warn(
                "Thumbnail error",
                error
              );

            }


            index++;

            drawNext();

          }
        );

      }


      drawNext();

    }
  );
}


/* =====================================================
   BUILD FFMPEG FILTER
===================================================== */

function buildVideoFilter(){

  const filters = [];


  /*
   * Crop
   */

  if(
    crop.x > 0.01 ||
    crop.y > 0.01 ||
    crop.w < 99.99 ||
    crop.h < 99.99
  ){

    const w =
      "trunc(iw*" +
      (
        crop.w / 100
      ).toFixed(6) +
      "/2)*2";


    const h =
      "trunc(ih*" +
      (
        crop.h / 100
      ).toFixed(6) +
      "/2)*2";


    const x =
      "trunc(iw*" +
      (
        crop.x / 100
      ).toFixed(6) +
      "/2)*2";


    const y =
      "trunc(ih*" +
      (
        crop.y / 100
      ).toFixed(6) +
      "/2)*2";


    filters.push(
      "crop=" +
      w +
      ":" +
      h +
      ":" +
      x +
      ":" +
      y
    );

  }


  /*
   * Mirror
   */

  if(mirror){

    filters.push(
      "hflip"
    );

  }


  /*
   * Rotation
   */

  if(rotate === 90){

    filters.push(
      "transpose=1"
    );

  }


  if(rotate === 180){

    filters.push(
      "hflip",
      "vflip"
    );

  }


  if(rotate === 270){

    filters.push(
      "transpose=2"
    );

  }


  return filters.length
    ? filters.join(",")
    : "null";
}


/* =====================================================
   CLEAN FFMPEG FILES
===================================================== */

async function safeDelete(
  filename
){

  if(!ffmpeg)
    return;


  try{

    await ffmpeg.deleteFile(
      filename
    );

  }catch(e){}

}


/* =====================================================
   EXPORT
===================================================== */

async function exportVideo(){

  if(!sourceFile){

    alert(
      "Сначала загрузите видео."
    );

    return;
  }


  if(isExporting)
    return;


  isExporting =
    true;


  saveBtn.disabled =
    true;

  chooseBtn.disabled =
    true;


  playBtn.disabled =
    true;


  downloadPanel.classList.remove(
    "show"
  );


  setProgress(0);


  try{

    /*
     * 1. Load FFmpeg
     */

    const loaded =
      await loadFFmpeg();


    if(!loaded){

      throw new Error(
        "FFmpeg не загружен."
      );

    }


    /*
     * 2. Prepare filenames
     */

    const inputName =
      "aura_input.mp4";

    const outputName =
      "aura_output.mp4";


    /*
     * 3. Convert File to Uint8Array
     *
     * No @ffmpeg/util dependency required.
     */

    setStatus(
      "Подготовка видео…",
      true
    );


    const arrayBuffer =
      await sourceFile.arrayBuffer();


    const inputData =
      new Uint8Array(
        arrayBuffer
      );


    /*
     * 4. Write to FFmpeg FS
     */

    await safeDelete(
      inputName
    );

    await safeDelete(
      outputName
    );


    await ffmpeg.writeFile(
      inputName,
      inputData
    );


    /*
     * 5. Trim
     */

    const trimStart =
      Math.max(
        0,
        Number(startTime) || 0
      );


    const trimEnd =
      Math.min(
        duration,
        Math.max(
          trimStart + 0.05,
          Number(endTime) ||
            duration
        )
      );


    const trimDuration =
      Math.max(
        0.05,
        trimEnd -
        trimStart
      );


    /*
     * 6. Filter
     */

    const filter =
      buildVideoFilter();


    /*
     * 7. FFmpeg command
     *
     * Everything is re-encoded to
     * a widely compatible MP4:
     *
     * H.264 + AAC
     */

    const args = [

      "-ss",
      trimStart.toFixed(3),

      "-i",
      inputName,

      "-t",
      trimDuration.toFixed(3),

      "-vf",
      filter,

      "-c:v",
      "libx264",

      "-preset",
      "veryfast",

      "-crf",
      "23",

      "-pix_fmt",
      "yuv420p",

      "-movflags",
      "+faststart"

    ];


    /*
     * Audio
     */

    if(muted){

      args.push(
        "-an"
      );

    }else{

      args.push(
        "-c:a",
        "aac",
        "-b:a",
        "128k",
        "-ar",
        "48000"
      );

    }


    args.push(
      "-y",
      outputName
    );


    console.log(
      "AURA FFmpeg args:",
      args
    );


    /*
     * 8. Run
     */

    setStatus(
      "Обработка видео…",
      true
    );


    setProgress(2);


    await ffmpeg.exec(
      args
    );


    /*
     * 9. Read result
     */

    setProgress(96);


    const outputData =
      await ffmpeg.readFile(
        outputName
      );


    if(
      !outputData ||
      !outputData.length
    ){

      throw new Error(
        "FFmpeg завершился, но выходной файл пустой."
      );

    }


    /*
     * 10. Create Blob
     */

    const outputBytes =
      outputData instanceof Uint8Array
        ? outputData
        : new Uint8Array(outputData);

    resultBlob =
      new Blob(
        [outputBytes],
        {
          type:
            "video/mp4"
        }
      );


    if(
      !resultBlob.size
    ){

      throw new Error(
        "Получен пустой MP4."
      );

    }


    /*
     * 11. Create result URL
     */

    revokeURL(
      resultURL
    );


    resultURL =
      URL.createObjectURL(
        resultBlob
      );


    /*
     * 12. Show result
     */

    video.pause();

    video.src =
      resultURL;

    video.load();


    setProgress(100);


    setStatus(
      "Видео готово",
      true
    );


    /*
     * Show download window.
     *
     * We deliberately don't force
     * an automatic download here.
     *
     * The user click on "Скачать MP4"
     * gives the browser the best chance
     * to allow the download.
     */

    downloadPanel.classList.add(
      "show"
    );


    /*
     * Cleanup FFmpeg virtual FS.
     */

    await safeDelete(
      inputName
    );

    await safeDelete(
      outputName
    );


  }catch(error){

    console.error(
      "AURA EXPORT ERROR:",
      error
    );


    setProgress(0);


    setStatus(
      "Ошибка обработки видео",
      true
    );


    alert(
      "Не удалось обработать видео.\n\n" +
      error.message +
      "\n\n" +
      "Откройте F12 → Console и пришлите ошибку, если она повторится."
    );

  }finally{

    isExporting =
      false;


    saveBtn.disabled =
      !sourceFile;

    chooseBtn.disabled =
      false;


    playBtn.disabled =
      !sourceFile;

  }
}


/* =====================================================
   DOWNLOAD METHOD 1
   File System Access API
===================================================== */

async function downloadWithSavePicker(){

  if(
    !resultBlob
  ){

    throw new Error(
      "Нет готового файла."
    );

  }


  if(
    typeof window.showSaveFilePicker !==
      "function"
  ){

    throw new Error(
      "Save Picker недоступен."
    );

  }


  const filename =
    fileBaseName(
      sourceFile &&
      sourceFile.name
    ) +
    "_edited.mp4";


  const handle =
    await window.showSaveFilePicker({

      suggestedName:
        filename,

      types:[
        {
          description:
            "MP4 video",

          accept:{
            "video/mp4":[
              ".mp4"
            ]
          }
        }
      ]

    });


  const writable =
    await handle.createWritable();


  await writable.write(
    resultBlob
  );


  await writable.close();


  return true;
}


/* =====================================================
   DOWNLOAD METHOD 2
   Anchor download
===================================================== */

function downloadWithAnchor(){

  if(
    !resultURL ||
    !resultBlob
  ){

    throw new Error(
      "Нет готового файла."
    );

  }


  const filename =
    fileBaseName(
      sourceFile &&
      sourceFile.name
    ) +
    "_edited.mp4";


  const anchor =
    document.createElement(
      "a"
    );


  anchor.href =
    resultURL;

  anchor.download =
    filename;

  anchor.rel =
    "noopener";


  /*
   * Do not set target="_blank" here.
   * A new tab opens the Blob URL instead of
   * starting a direct download.
   */


  /*
   * Add to DOM before click.
   */

  anchor.style.display =
    "none";


  document.body.appendChild(
    anchor
  );


  anchor.click();


  setTimeout(
    () => {

      try{
        anchor.remove();
      }catch(e){}

    },
    1000
  );


  return true;
}


/* =====================================================
   DOWNLOAD METHOD 3
   OPEN RESULT
===================================================== */

function openResult(){

  if(
    !resultURL ||
    !resultBlob
  ){

    alert(
      "Готового видео пока нет."
    );

    return;
  }


  /*
   * This is the most reliable fallback
   * when Wix/browser blocks download.
   */

  const newWindow =
    window.open(
      resultURL,
      "_blank"
    );


  if(!newWindow){

    alert(
      "Браузер заблокировал новое окно.\n\n" +
      "Разрешите всплывающие окна для сайта Wix."
    );

    return;
  }


  try{

    newWindow.focus();

  }catch(e){}
}


/* =====================================================
   SMART DOWNLOAD
===================================================== */

async function smartDownload(){

  if(
    !resultBlob ||
    !resultURL
  ){

    alert(
      "Сначала дождитесь завершения обработки."
    );

    return;
  }


  /*
   * Wix embeds the editor in a cross-origin iframe.
   * showSaveFilePicker is not available there and
   * awaiting its rejection consumes the temporary
   * user activation required for a download.
   *
   * Start the anchor download synchronously while
   * the original button click is still active.
   */

  let isEmbedded = false;


  try{

    isEmbedded =
      window.self !== window.top;

  }catch(error){

    isEmbedded = true;

  }


  if(isEmbedded){

    try{

      downloadWithAnchor();


      setStatus(
        "Скачивание запущено",
        true
      );


      return;

    }catch(error){

      console.log(
        "AURA iframe download failed:",
        error
      );


      openResult();

      return;

    }

  }


  /*
   * METHOD 1
   *
   * Native Save Picker.
   */

  try{

    await downloadWithSavePicker();

    setStatus(
      "Файл сохранён",
      true
    );

    return;

  }catch(error){

    console.log(
      "AURA download method 1 unavailable:",
      error
    );

  }


  /*
   * METHOD 2
   *
   * Normal browser download.
   */

  try{

    downloadWithAnchor();


    setStatus(
      "Скачивание запущено",
      true
    );


    /*
     * We cannot reliably know whether
     * Chrome actually accepted a sandboxed
     * iframe download.
     *
     * Therefore keep fallback visible.
     */

    setTimeout(
      () => {

        setStatus(
          "Если загрузка не началась — нажмите «Открыть видео»",
          true
        );

      },
      1200
    );


    return;

  }catch(error){

    console.log(
      "AURA download method 2 failed:",
      error
    );

  }


  /*
   * METHOD 3
   */

  openResult();
}
